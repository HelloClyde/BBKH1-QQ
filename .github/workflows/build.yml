name: H1 QQ build and offline MIPS verification
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      SOURCE_DATE_EPOCH: '1794614400'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pinned dependencies and toolchain
        run: |
          python -m pip install -r requirements-test.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python sdk/scripts/install_gnu_toolchain.py --dest .tools/toolchain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "H1_GNU_BIN=$((Resolve-Path .tools/toolchain/bin).Path)" >> $env:GITHUB_ENV
      - name: Check repository and build from source
        run: |
          python tools/check_repository.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Actual linked MIPS and synthetic protocol peers
        run: python tools/test_mips.py
      - name: Package the same verified build
        run: python tools/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: H1QQ-preview
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: H1QQ-offline-evidence
          path: |
            build/client/*.json
            build/client/model/*.json
            build/client/skin-*.png
          if-no-files-found: warn
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python tools/test_core.py
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, core]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: H1QQ-preview
          path: release-assets
      - name: Verify checked artifacts and create a preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -ne ('v' + (Get-Content VERSION -Raw).Trim())) { throw 'Tag/version mismatch' }
          foreach ($line in Get-Content release-assets/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path release-assets $parts[1])).Hash.ToLowerInvariant()
            if ($hash -ne $parts[0]) { throw 'Artifact digest mismatch' }
          }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release exists; refusing overwrite' }
          gh release create $env:RELEASE_TAG --verify-tag --prerelease --title "H1 QQ $env:RELEASE_TAG 预览版" --notes-file RELEASE_NOTES.md release-assets/*
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
